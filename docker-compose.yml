name: aperture
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aperture
      POSTGRES_USER: aperture
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports: ['127.0.0.1:${DB_PORT:-54331}:5432']
    volumes: ['aperture-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aperture -d aperture']
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  aperture-data:

