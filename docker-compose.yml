name: aperture
services:
  api:
    build:
      context: .
      dockerfile: backend/Aperture.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: '8080'
      ConnectionStrings__Exams: Host=db;Database=aperture;Username=aperture;Password=${POSTGRES_PASSWORD}
      Database__Migrate: 'true'
      Database__Seed: 'true'
      Demo__Enabled: 'true'
      Demo__InstructorPassword: ${DEMO_INSTRUCTOR_PASSWORD:?}
      DataProtection__KeyPath: /app/keys
    volumes: ['aperture-keys:/app/keys']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'dotnet', 'Aperture.Api.dll', '--healthcheck']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 15
    read_only: true
    tmpfs: ['/tmp']
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ['127.0.0.1:${WEB_PORT:-18082}:80']
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/api/health']
      interval: 10s
      timeout: 5s
      retries: 10
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aperture
      POSTGRES_USER: aperture
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports: ['127.0.0.1:${DB_PORT:-54331}:5432']
    volumes: ['aperture-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aperture -d aperture']
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  aperture-data:
  aperture-keys:
